# robots/unitree_go2w/robot.yaml
# Unitree Go2W (quadruped with a passive wheel at each leg tip)
# Model: MimicKit go2w_mimickit_style.xml

name: unitree_go2w
scene_xml: robots/unitree_go2w/assets/scene.xml
mjcf: robots/unitree_go2w/assets/go2w_mimickit_style.xml
base_body: base
sim_freq: 200

# Ordered end-effectors. `name` is what gait code and prompts use.
# ground_offset = distance from body origin to contact point (wheel rim).
end_effectors:
  - {name: FL, body: FL_wheel_link, ground_offset: 0.1244}
  - {name: FR, body: FR_wheel_link, ground_offset: 0.1244}
  - {name: RL, body: RL_wheel_link, ground_offset: 0.1244}
  - {name: RR, body: RR_wheel_link, ground_offset: 0.1244}

# In model qpos[7:] order (what gets recorded). passive: true = unactuated wheel.
joints:
  - {name: FL_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: FL_thigh_joint, limits: [-1.5708, 3.4907]}
  - {name: FL_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: FL_wheel_joint, passive: true}
  - {name: FR_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: FR_thigh_joint, limits: [-1.5708, 3.4907]}
  - {name: FR_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: FR_wheel_joint, passive: true}
  - {name: RL_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: RL_thigh_joint, limits: [-0.5236, 4.5379]}
  - {name: RL_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: RL_wheel_joint, passive: true}
  - {name: RR_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: RR_thigh_joint, limits: [-0.5236, 4.5379]}
  - {name: RR_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: RR_wheel_joint, passive: true}

base_height_range: [0.10, 0.68]

camera: {lookat: [0.0, 0.0, 0.35], distance: 2.5, azimuth: 90, elevation: -20}

example_skill: robots/unitree_go2w/example.py
robot_card: |
  The robot is a Unitree Go2W: a quadruped with a PASSIVE WHEEL at the tip of
  each of its four legs. The end-effectors are the four wheel centers, named
  FL, FR, RL, RR (front/rear x left/right). Leg/EE names always start with one
  of FL, FR, RL, RR — use startswith() for side or front/rear grouping.
  Each leg has 3 actuated joints (abduction hip, thigh, knee); the wheel joints
  are passive and must NEVER be commanded (no wheel velocities, forces, or
  torques). All motion is purely kinematic.

  Wheels are conceptual and support two skill families:
  - ACTIVE-WHEEL skills: the base glides while legs hold pose (rolling,
    driven spins, wheeled slides, aerial flips landing on wheels).
  - PASSIVE-WHEEL skills: legs push/skate against the ground and the robot
    glides between pushes (skating strokes, gliding, edge work).
  Typical legged coordination groups: diagonal pairs (FL+RR / FR+RL) for
  trotting, front pair vs rear pair for bounding, single-leg sequences for
  crawling.

# robots/unitree_go2/robot.yaml
# Unitree Go2 (legged quadruped, no wheels)
# Model: MimicKit go2.xml

name: unitree_go2
scene_xml: robots/unitree_go2/assets/scene.xml
mjcf: robots/unitree_go2/assets/go2.xml
base_body: base
sim_freq: 200

# Ordered end-effectors. `name` is what gait code and prompts use.
# ground_offset = distance from body origin to contact point (foot sphere).
end_effectors:
  - {name: FL, body: FL_foot, ground_offset: 0.022}
  - {name: FR, body: FR_foot, ground_offset: 0.022}
  - {name: RL, body: RL_foot, ground_offset: 0.022}
  - {name: RR, body: RR_foot, ground_offset: 0.022}

# In model qpos[7:] order (what gets recorded).
joints:
  - {name: FL_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: FL_thigh_joint, limits: [-1.5708, 3.4907]}
  - {name: FL_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: FR_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: FR_thigh_joint, limits: [-1.5708, 3.4907]}
  - {name: FR_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: RL_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: RL_thigh_joint, limits: [-0.5236, 4.5379]}
  - {name: RL_calf_joint,  limits: [-2.7227, -0.83776]}
  - {name: RR_hip_joint,   limits: [-1.0472, 1.0472]}
  - {name: RR_thigh_joint, limits: [-0.5236, 4.5379]}
  - {name: RR_calf_joint,  limits: [-2.7227, -0.83776]}

base_height_range: [0.10, 0.55]

camera: {lookat: [0.0, 0.0, 0.3], distance: 2.0, azimuth: 90, elevation: -20}

example_skill: robots/unitree_go2/example.py
robot_card: |
  The robot is a Unitree Go2: a legged quadruped (no wheels). The
  end-effectors are the four feet, named FL, FR, RL, RR (front/rear x
  left/right). Leg/EE names always start with one of FL, FR, RL, RR — use
  startswith() for side or front/rear grouping. Each leg has 3 actuated
  joints (abduction hip, thigh, knee). All motion is purely kinematic.

  Typical legged coordination groups: diagonal pairs (FL+RR / FR+RL) for
  trotting, front pair vs rear pair for bounding/pronking, lateral pairs for
  pacing, single-leg sequences for crawling. Feet must lift clear of the
  ground during swing and stay planted during stance.
